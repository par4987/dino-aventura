<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dino Aventura</title>
  <meta name="description" content="Dino Aventura: un juego para niños de 2 a 5 años, sin publicidad y sin recopilar datos.">
  <link rel="icon" href="icono.png">
  <style>
    :root { --bg: #e9f8ff; --card: #fff; --ink: #2b2b3b; --muted: #5d6275; --accent: #3d8a2a; }
    @media (prefers-color-scheme: dark) { :root { --bg: #161a26; --card: #1f2433; --ink: #eceff7; --muted: #a9afc3; --accent: #8bd66a; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
           font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 520px; margin: 24px 16px; padding: 32px 24px; background: var(--card); border-radius: 24px; text-align: center; }
    img { width: 128px; height: 128px; border-radius: 28px; }
    h1 { margin: 12px 0 4px; }
    p { color: var(--muted); }
    a { color: var(--accent); font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <img src="icono.png" alt="Ícono de Dino Aventura">
    <h1>Dino Aventura</h1>
    <p>Un juego para niños de 2 a 5 años: elegí tu dinosaurio y recorré 10 escenarios esquivando amenazas. Sin publicidad, sin compras y sin recopilar datos.</p>
    <p><a href="politica-de-privacidad.html">Política de privacidad</a> · <a href="politica-de-privacidad.html#en">Privacy policy</a></p>
  </main>
</body>
</html>
